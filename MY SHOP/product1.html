<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Áo thun - MY SHOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>MY SHOP</h1>
        <p>Chi tiết sản phẩm</p>
    </header>


    <main>

        <section class="product-detail">

            <!-- Hình sản phẩm -->
            <img src="images/hau1.jpg" alt="Áo thun">


            <!-- Tên sản phẩm -->
            <h2>Áo thun</h2>


            <!-- Giá -->
            <p>Giá: 3000円</p>


            <!-- Mô tả -->
            <p>
                san pham nay muon lay vo som
            </p>


            <!-- Số lượng trong kho -->
           <p>Còn hàng: <span id="stock">10</span> cái</p>


            <!-- Nhập số lượng muốn mua -->
            <label for="quantity">
                Số lượng:
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                max="10"
                value="1"
            >


            <br><br>


            <!-- Nút mua hàng -->
            <button onclick="buyProduct()">
    Mua sản phẩm
</button>
<p id="result"></p>


            <br><br>


            <!-- Quay lại trang chủ -->
            <button onclick="history.back()">
                Quay lại
            </button>

        </section>

    </main>
    <script>

    let price = 3000;
    let stock = 10;


    function buyProduct() {

        let quantity = Number(
            document.getElementById("quantity").value
        );


        if (quantity <= 0) {

            document.getElementById("result").innerHTML =
                "Vui lòng nhập số lượng.";

            return;
        }


        if (quantity > stock) {

            document.getElementById("result").innerHTML =
                "Không đủ hàng trong kho.";

            return;
        }


        let total = quantity * price;


        stock = stock - quantity;


        document.getElementById("stock").innerHTML = stock;


        document.getElementById("result").innerHTML =
            "Bạn đã mua " + quantity + " cái<br>" +
            "Tổng tiền: " + total + "円";

    }

</script>

</body>


</html>
