<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Áo thun - MY SHOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>MY SHOP</h1>
        <p>Chi tiết sản phẩm</p>
    </header>


    <main>

        <section class="product-detail">

            <!-- Hình sản phẩm -->
            <img src="images/hau2.jpg" alt="quan jean">


            <!-- Tên sản phẩm -->
            <h2>quan jean</h2>


            <!-- Giá -->
            <p>Giá: 3000円</p>


            <!-- Mô tả -->
            <p>
                san pham nay muon lay vo som
            </p>


            <!-- Số lượng trong kho -->
            <p>Còn hàng: 10 cái</p>


            <!-- Nhập số lượng muốn mua -->
            <label for="quantity">
                Số lượng:
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                max="10"
                value="1"
            >


            <br><br>


            <!-- Nút mua hàng -->
            <button onclick="buyProduct()">
    Mua sản phẩm
</button>


            <br><br>


            <!-- Quay lại trang chủ -->
            <button onclick="history.back()">
                Quay lại
            </button>

        </section>

    </main>
    <script>

    function buyProduct() {

        let quantity = document.getElementById("quantity").value;

        let price = 3000;

        let total = quantity * price;

        document.write("Bạn đã mua: " + quantity + " cái<br>");
        document.write("Tổng tiền: " + total + "円");

    }

</script>

</body>


</html>
