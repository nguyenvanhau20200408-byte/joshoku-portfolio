<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quần jean - MY SHOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="product-detail">

        <img src="images/hau2.jpg" alt="Quần jean">

        <h2>Quần jean</h2>

        <p>Giá: 5000円</p>

        <p>
            Quần jean thời trang, phù hợp để mặc hằng ngày.
        </p>

        <p>
            Còn hàng: <span id="stock">10</span> cái
        </p>

        <label>
            Số lượng:
        </label>

        <input
            type="number"
            id="quantity"
            min="1"
            max="10"
            value="1"
        >

        <br><br>

        <button onclick="buyProduct()">
            Mua sản phẩm
        </button>

        <button onclick="history.back()">
            Quay lại
        </button>

        <p id="result"></p>

    </div>


    <script>

        let price = 5000;

        let stock = 10;


        function buyProduct() {

            let quantity = Number(
                document.getElementById("quantity").value
            );


            if (quantity <= 0) {

                document.getElementById("result").innerHTML =
                    "Vui lòng nhập số lượng.";

                return;
            }


            if (quantity > stock) {

                document.getElementById("result").innerHTML =
                    "Không đủ hàng trong kho.";

                return;
            }


            let total = quantity * price;


            stock = stock - quantity;


            document.getElementById("stock").innerHTML =
                stock;


            document.getElementById("result").innerHTML =
                "Bạn đã mua " + quantity + " cái<br>" +
                "Tổng tiền: " + total + "円";

        }

    </script>

</body>

</html>
